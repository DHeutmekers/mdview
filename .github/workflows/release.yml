name: Release

# Publishing a GitHub release with a tag like v1.2.0 builds MdView and attaches:
#   MdView-Setup-1.2.0.exe, MdView-1.2.0-portable.zip, SHA256SUMS.txt
# The in-app updater looks for exactly these file names.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as a test artifact (x.y.z), nothing is published"
        required: true
        default: "0.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mono-devel nsis zip

      - name: Determine version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then V="${TAG#v}"; V="${V#V}"; else V="$INPUT"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (got '$TAG')"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        run: VERSION="${{ steps.v.outputs.version }}" ./build.sh

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MdView-${{ steps.v.outputs.version }}
          path: out/*
