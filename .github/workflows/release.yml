name: Release

# Three ways to release, all build MdView and attach:
#   MdView-Setup-1.2.0.exe, MdView-1.2.0-portable.zip, SHA256SUMS.txt
# - publish a GitHub release with a tag like v1.2.0,
# - push a tag like v1.2.0; the workflow then creates the release itself, or
# - run this workflow manually on main with "publish" ticked; it creates the
#   tag and the release. Without "publish" it only builds a test artifact.
# The in-app updater looks for exactly these file names.
on:
  release:
    types: [published]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (x.y.z)"
        required: true
        default: "0.0.1"
      publish:
        description: "Publish as release vX.Y.Z (creates the tag on this commit)"
        type: boolean
        default: false

permissions:
  contents: write

# Publishing a release in the UI can also fire the tag push; run one build per tag at a time.
concurrency:
  group: release-${{ github.event.release.tag_name || (inputs.version && format('v{0}', inputs.version)) || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mono-devel nsis zip

      - name: Determine version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then V="${TAG#v}"; V="${V#V}"; else V="$INPUT"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (got '$TAG')"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        run: VERSION="${{ steps.v.outputs.version }}" ./build.sh

      - name: Attach to release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Publish only from main (this run is on $GITHUB_REF)"; exit 1
            fi
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists"; exit 1
            fi
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "MdView $VERSION" --generate-notes
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          elif [ "$GITHUB_EVENT_NAME" = "release" ]; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release was published in the UI; its own run attaches the files.
            echo "Release $TAG already exists, nothing to do."
          else
            # Draft first, publish once the files are attached, so the in-app updater
            # never sees a release without an installer. (A release published with
            # GITHUB_TOKEN doesn't trigger the release event again.)
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "MdView $VERSION" --generate-notes
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: MdView-${{ steps.v.outputs.version }}
          path: out/*
