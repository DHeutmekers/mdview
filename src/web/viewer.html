<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MdView</title>
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="lib/hljs-light.css" id="hljs-light">
<link rel="stylesheet" href="lib/hljs-dark.css" id="hljs-dark" disabled>
<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('mdview-theme') || 'auto'; } catch (e) {}
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    try { if (localStorage.getItem('mdview-toc') === 'hidden') document.documentElement.classList.add('toc-hidden'); } catch (e) {}
  })();
</script>
</head>
<body>
  <nav id="sidebar" aria-label="Table of contents">
    <div class="sidebar-head">
      <span class="sidebar-title">Contents</span>
    </div>
    <input id="toc-filter" type="search" placeholder="Filter headings…" autocomplete="off">
    <ul id="toc"></ul>
  </nav>

  <div id="main">
    <header id="toolbar">
      <button id="btn-toc" title="Toggle contents (Ctrl+B)" aria-label="Toggle contents">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <span id="doc-name"></span>
      <span class="spacer"></span>
      <span id="reload-flash">Updated</span>
      <button id="btn-update" class="pill" hidden></button>
      <button id="btn-open" title="Open file (Ctrl+O)" aria-label="Open file">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button id="btn-reload" title="Reload (F5)" aria-label="Reload">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <button id="btn-print" title="Print / save as PDF (Ctrl+P)" aria-label="Print">
        <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>
      </button>
      <button id="btn-theme" title="Theme: auto" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" class="ico-auto"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
        <svg viewBox="0 0 24 24" class="ico-light"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg viewBox="0 0 24 24" class="ico-dark"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="btn-about" title="MdView — check for updates" aria-label="About and updates">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
      </button>
    </header>

    <article id="content" class="markdown-body">
      <div class="empty">
        <h1>MdView</h1>
        <p>Open a Markdown file with <kbd>Ctrl</kbd>+<kbd>O</kbd>, or drop one onto this window.</p>
      </div>
    </article>
  </div>

  <script src="lib/marked.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="lib/powershell.min.js"></script>
  <script src="lib/vbnet.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
